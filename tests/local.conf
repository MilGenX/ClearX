# Settings the tests add on top of clearx.conf (like a user's clearx.local.conf)
[protected]
names = WindowServer, Finder, Dock, loginwindow, kernel_task, Xcode, Terminal, iTerm2, SystemUIServer, ControlCenter, WindowManager, NotificationCenter, Activity Monitor, launchd, coreaudiod, osascript, top, ps, ioreg, sysctl, vm_stat, llama-server, ollama*, mlx_lm*, lms, LM Studio*, cloudflared, ngrok, tailscaled, ClearX, pmset, taskpolicy, renice, mds, mds_stores, mdworker*, cfprefsd, distnoted, com.apple.Virtualization.VirtualMachine, Claude*

[modes]
studio_apps = Logic Pro, Ableton Live*

[queue]
scripts = release.py build

[keeper]
# the tick never starts the disk keeper in these tests (tests/test_keeper.py covers it)
enabled = false
