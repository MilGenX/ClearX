# ClearX (formerly memguard) configuration. Edit freely; changes apply on the next tick (every 10 s).
# Sizes accept K/M/G suffixes. Name patterns are case-insensitive shell globs
# matched against the process name (e.g. "clang", "Brave Browser*").

[general]
# Seconds between ticks is set in the LaunchAgent (StartInterval), not here.
dry_run = false
notify = true
# Treat swap thresholds as "active" only while the system is actually swapping
# (swapouts since last tick >= this many MB) or pressure is not normal.
# Swap usage on macOS stays high long after pressure ends, so without this
# memguard would sit at RED forever.
swap_active_mb = 8
heartbeat_min = 5
log_max_mb = 5
log_keep = 3

[levels]
yellow_swap = 2G
orange_swap = 3G
orange_free = 1G
red_swap = 3.5G
red_proc_min = 500M

[freezer]
# App Freezer (iOS-style). While the pool is yellow or worse, an app that isn't frontmost, hasn't been used for
# idle_min minutes and uses >= min_mem is stopped (SIGSTOP): its memory compresses/swaps out once and stops
# churning. MemGuard.app wakes it (SIGCONT) the instant you switch to it (Cmd-Tab, Dock, click). Never frozen:
# the front app, anything holding a power assertion (audio playback, calls, downloads), anything moving > 1 MB
# on the network in the last 30 s, DAWs, compilers, the protected list and `never`. Browsers: only their tab
# renderers. Everything wakes when the pool is green, when this is disabled, or if MemGuard.app isn't running.
enabled = true
idle_min = 5
recent_min = 1
min_mem = 300M
max_min = 60
never = Finder, Dock, Claude*, Terminal, iTerm2, Xcode*, ClearX, MemGuard, SoundGrid*, Waves*, MyDAW, XDAW, Activity Monitor,
        System Settings, Simulator, zoom.us, FaceTime, Music
renderer_only = Brave Browser, Google Chrome
# don't freeze more once compressed memory reaches this: past it, frozen memory goes to swap (SSD writes)
compressor_max = 4G

[reserve]
# RAM reserve: the controller's first goal is to keep `target` ready to use (free + file cache macOS reuses
# instantly). Below it, one step per tick: freeze idle hidden apps (browsers: tab renderers only), even when
# the pool is green; then builds to 2 jobs at background QoS; then also hidden apps idle >= freezer recent_min.
# Never the front app, audio, the DAW or downloads. If the front app + DAW + builds alone leave less than
# `target`, the menu says the reserve can't be held without pausing the build, and it stops escalating.
enabled = true
target = 10G
hysteresis = 1G

[interactive]
# Interactive-aware builds: while you're using the Mac (input in the last active_s), compile jobs run at
# background QoS and the next Xcode build gets at most active_jobs; after idle_s with no input, full speed.
enabled = true
active_s = 60
idle_s = 120
# 2 compile jobs while you're using the Mac: each MyDAW compile job is ~1.4 GB, and memory pushed out to make room
# for them is written to the SSD as swap. Full speed (the pool's cap) once you've been away idle_s.
active_jobs = 2
# automatic builders (path contains one of these): MyDAW's auto-update and MyApp's builder worktree. While you're
# active they run at background QoS, which also puts their disk writes in the lowest I/O tier.
build_paths = /auto-src/, /.worktrees/builder/

[resume]
# Resume paused processes one per tick once swap < resume_swap, OR once pressure
# is normal, free >= resume_free and nothing was swapped out since last tick.
resume_swap = 2G
resume_free = 1.5G
max_pause_min = 15
# After a forced (timeout) resume, don't re-pause that process for this long.
repause_cooldown_min = 10
# resume pressure-paused processes only after the pool has been green this long (no pause/resume flapping)
steady_s = 60

[predict]
# Act on the trend: if available memory (free+inactive+purgeable) is falling fast enough
# that it will run out in < tte_s seconds, go to ORANGE early.
window_s = 30
tte_s = 60
min_rate = 50M
avail_below = 3G

[build_guard]
# Summed memory of running compiler jobs is capped; newest jobs beyond the cap are paused
# and resumed (oldest first) as others finish, so builds finish instead of thrashing.
enabled = true
budget = 6G
compilers = clang, clang++, clang-*, swift-frontend, ld, ld64, ld-prime, rustc, cc1plus, cc1
max_pause_min = 60

[cpu]
# A non-protected process above limit_pct (100 = one core) for sustain_s -> background QoS;
# still hot after another sustain_s -> duty-cycled to `duty` (SIGSTOP/SIGCONT). Released when calm.
enabled = true
limit_pct = 300
sustain_s = 60
duty = 0.5
release_pct = 150
# informational only (logged, never touched by the CPU governor):
watch = node, Python*, Brave Browser Helper*, Google Drive*, mds_stores
watch_pct = 100

[pool]
# RAM (16 GB) + VRAM (4 GB) are run as one 20 GB pool. Each tick computes one state (green/yellow/orange/red)
# from RAM pressure, swap-out rate, free/compressed memory, predicted exhaustion and disk health; VRAM full on
# its own is fine. Priority: foreground app / DAW (never touched) > builds > background apps.
# GPU spill = system RAM the GPU maps over PCIe when VRAM is full (ioreg inUseSysMemoryBytes). Growing faster
# than spill_rate while the pool is yellow+ -> background the GPU-heavy background apps first; the build guard
# then waits spill_grace_s before tightening the compiler budget.
spill_rate = 8M
spill_window_s = 30
spill_grace_s = 20
# Thermal throttling: compilers capped to thermal_jobs at once first; still throttling after
# thermal_ui_after_s -> background the GPU-heavy/browser background apps too.
thermal_jobs = 4
thermal_ui_after_s = 60
# Xcode/xcodebuild parallel compile tasks for the NEXT build (read at build start), set from the pool state.
# MyDAW/JUCE compile jobs use ~1.4 GB each: 8 jobs = ~11 GB (measured 2026-10-26), which makes a 10 GB RAM reserve
# impossible on 16 GB. 4 jobs = ~5.6 GB. Raise to 8 with more RAM.
jobs_healthy = 4
jobs_normal = 4
jobs_pressure = 2
# Swap lives on the internal SSD. If it has less than disk_min_free, or a 4 KB write+fsync takes
# >= disk_slow_ms (median of the last 6 ticks), the pool goes yellow as soon as RAM is tight (avail < tight_avail
# or swapping) and per-app budgets apply even at green.
disk_min_free = 40G
disk_slow_ms = 50
tight_avail = 4G
# orange pauses the largest background process only if it's at least this big
pause_min = 200M

[modes]
# One user-facing mode (Max). These lists only set internal priorities: a DAW gets first claim, a build second.

studio_apps = MyDAW, XDAW, Logic Pro X, Logic Pro, Ableton Live*, Live, REAPER, Bitwig Studio, FL Studio*, GarageBand
build_tools = xcodebuild, SWBBuildService, XCBBuildService, ninja, make, cargo, swift-build

[mode.normal]
budget_scale = 1
compiler_budget = 6G
background =

[mode.build]
budget_scale = 1
compiler_budget = 6G
background = Brave Browser*

[mode.studio]
budget_scale = 0.5
compiler_budget = 3G
background = Brave Browser*, Google Drive*, node, Python*

[heavy]
# yellow: renice +10 (lower priority) on these
names = clang, clang++, swift-frontend, swift-driver, python*, Python, node, ld, ld64, cc1plus, rustc

[budgets]
# Soft per-app memory budgets, summed across all processes whose name matches the glob. They act only
# when the pool is yellow+ (or the disk is tight): over budget -> renice +10 + background QoS; still over at
# orange+ -> pause the largest. At green an app may use as much as it likes. Never applied to the foreground app.
Python* = 4G
Brave Browser* = 3G
com.apple.Virtualization.VirtualMachine = 4G

[protected]
# Never reniced or paused. Add your own lines below (one glob per line or comma-separated).
names = WindowServer, Finder, Dock, loginwindow, kernel_task, Claude*, claude, Xcode,
        Terminal, iTerm2, SystemUIServer, ControlCenter, WindowManager, NotificationCenter,
        Activity Monitor, launchd, coreaudiod, osascript, top, ps, ioreg, sysctl, vm_stat,
        llama-server, ollama*, mlx_lm*, lms, LM Studio*,
        ClearX, MemGuard, pmset, taskpolicy, renice, mds, mds_stores, mdworker*, cfprefsd, distnoted,
        com.apple.Virtualization.VirtualMachine
user =

[vram]
total_mb = 4096
# per-app VRAM isn't exposed on Intel/AMD; these are the known GPU-heavy processes (backgrounded first when
# the GPU spills into RAM under pressure; never because VRAM alone is full)
gpu_heavy = com.apple.WebKit.GPU, Brave Browser Helper (GPU), MTLCompilerService, com.apple.Virtualization*, XDAW

[test]
# Leave empty in normal use. If set, ONLY processes whose full command line
# matches this regex are eligible for renice/pause (used by the self-test).
target_regex =
